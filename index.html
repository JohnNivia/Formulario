<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="formulario">
    <h1>Inicio Sesion</h1>
    <form method="post">
        <div class ="datos1">
            <label for="nombre">Nombre<span class="required">*</span></label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="Apellido">Apellido<span class="required">*</span></label>
            <input type="text" id="Apellido" name="Apellido"required>
            
            <label for="TipoDocumento">Tipo Documento<span class="required">*</span></label>
            <select name="TipoDocumento" id="TipoDocumento">
                <option value="TI">Tarjeta Identidad</option>
                <option value="CC">Cedula Ciudadania</option>
                <option value="CE">Cedula Extranjeria</option>
                <option value="PPT">Permiso de Proteccion Personal</option>
                <option value="">Pasaporte</option>
            </select>
        </div>
        <div class="Datos2">
        
            <label for="NumeroDocumento">Numero documento<span class="required">*</span></label>
            <input type="text" id="NumeroDocumento" name="NumeroDocumento"required>
        
            <label for="FechaNacimiento">Fecha Nacimiento<span class=required>*</span></label>
            <input type="date" id="FechaNacimiento" name="FechaNacimiento"required>
        
            <label for="Telefono">Telefono<span class="required">*</span></label>
            <input type="text" id="Telefono"name="Telefono"required>
        
            <label for="Correo">Correo<span class="required">*</span></label>
            <input type="email" id="Correo"name="email"required>
        
            <label for="PaisDomicilio">Pais de domicilio<span class="required">*</span></label>
            <input type="text" id="PaisDomicilio"name="PaisDomicilio"required>
        
            <label for="CiudadDomicilio">Ciudad de domicilio<span class="required">*</span></label>
            <input type="text" id="CiudadDomicilio"name="CiudadDomicilio"required>
        
    </div>
    <div class="ConfimarDatos">
        <label for="ConfimarDatos">Confimar Datos<span class="required">*</span></label>
        <input type="checkbox" name="ConfimarDatos" id="ConfimarDatos"required>
    </div>
    <button>Confimar</button>
        
    </form>


</div>
</body>
</html>
