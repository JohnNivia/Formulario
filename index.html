<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="formulario">
    <header>
        <div id="Titulo">
            <h2 class="titulo">Inicio Sesion</h2>
        </div>
        <div id="Parrafo">
            <p>Por favor ingrese la información solicitada</p>
        </div>
    </header>
    
    <form id="Formulario" method="post">
        <div class="Datos1">
            <div class="Nombre">
                <label for="Nombre">Nombre<span class="required">*</span></label>
                <input type="text" id="Nombre" name="nombre" placeholder="ej. John" required>
            </div>    
            <div class="Apellido">
                <label for="Apellido">Apellido<span class="required">*</span></label>
                <input type="text" id="Apellido" name="apellido" placeholder="ej. Nivia" required>
            </div>    
            <div class="tipoDocumento">
                <label for="TipoDocumento">Tipo Documento<span class="required">*</span></label>
                <select name="tipoDocumento" id="TipoDocumento">
                    <option value="" disabled selected>Tipo documento</option>
                    <option value="TI">Tarjeta Identidad</option>
                    <option value="CC"select>Cedula Ciudadania</option>
                    <option value="CE">Cedula Extranjeria</option>
                    <option value="PPT">Permiso de Proteccion Personal</option>
                    <option value="Pasaporte">Pasaporte</option>
                </select>
            </div>    
        </div>

        <div class="Datos2">  
            <div class="numeroDocumento">
                <label for="NumeroDocumento">Numero documento<span class="required">*</span></label>
                <input type="text" id="NumeroDocumento" name="numeroDocumento" placeholder="ej. 103165888" required>
            </div>    
            <div class="fechaNacimiento">
                <label for="FechaNacimiento">Fecha Nacimiento<span class="required">*</span></label>
                <input type="date" id="FechaNacimiento" name="fechaNacimiento" required>
            </div>    
            <div class="telefono">
                <label for="Telefono">Telefono<span class="required">*</span></label>
                <input type="text" id="Telefono" name="telefono" placeholder="ej. +57 3228467684" required>
            </div>    
            <div class="correo">
                <label for="Correo">Correo<span class="required">*</span></label>
                <input type="email" id="Correo" name="email" placeholder="ej. ejemplo.gmail.com" required>
            </div>    
            <div class="paisDomicilio">
                <label for="PaisDomicilio">Pais de domicilio<span class ="required">*</span></label>
                <select name="PaisDomicilio" id="paisDomicilio">
                    <option value="NA"disabled selected>Ingrese su Pais</option>
                    <option value="Mex">Mexico</option>
                    <option value="Col"selected>Colombia</option>
                    <option value="Es">España</option>
                    <option value="EEUU">Estados unidos</option>
                    <option value="Can">Canada</option>
                </select>
            </div>    
            <div class="ciudadDomicilio">
                <label for="CiudadDomicilio">Ciudad de domicilio<span class="required">*</span></label>
                <select name="ciudadDomicilio" id="CiudadDomicilio">
                    <option value="NA"disabled selected>Ingrese su pais</option>
                    <option value="CM">Ciudad de mexico</option>
                    <option value="Gua">Guadalajara</option>
                    <option value="Mont">Monterrey</option>
                    <option value="Bog"selected>Bogota</option>
                    <option value="Med">Medellin</option>
                    <option value="Bar">Barranquilla</option>
                    <option value="Mad">Madrid</option>
                    <option value="Bar">Barcelona</option>
                    <option value="Mal">Málaga</option>
                    <option value="Was">Washinton</option>
                    <option value="New">New york</option>
                    <option value="Ang">Angeles</option>
                    <option value="Ott">Ottawa</option>
                    <option value="Mont">Montreal</option>
                    <option value="Vanc">Vancouver</option>
                </select>
            </div>    
        </div>

        <div class="ConfimarDatos">
            <input type="checkbox" name="confimarDatos" id="ConfimarDatos" required>
            <label for="ConfimarDatos">Confimar Datos<span class="required">*</span></label>
        </div>

        <div class="Boton">
            <button type="submit">Confimar</button>
        </div>
    </form>
</div>

</body>
</html>
